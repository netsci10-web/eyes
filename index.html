<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>과학적 5단계 눈 운동 코치</title>
    <meta name="description" content="안과학 및 인지신경학계에서 입증된 과학적 근거 기반 5단계 눈 운동 프로그램" />
    <meta property="og:title" content="과학적 5단계 눈 운동 코치" />
    <meta property="og:description" content="안과학 및 인지신경학계에서 입증된 과학적 근거 기반 5단계 눈 운동 프로그램" />
    <style>
      body {
        margin: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
      }
      .initial-loader {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader"></div>
      <div style="font-size: 13px; color: #94a3b8; font-weight: 500;">과학적 5단계 눈 운동 코치를 불러오는 중...</div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171;">
        이 프로그램을 실행하려면 자바스크립트(JavaScript) 활성화가 필요합니다.
      </div>
    </noscript>
    <script>
      // Single Page App redirect decoder for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Global safety error logger to prevent white screens
      window.addEventListener('error', function(e) {
        console.error('Captured runtime error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.querySelector('.initial-loader'))) {
          root.innerHTML = '<div style="padding:32px;text-align:center;max-width:440px;margin:40px auto;background:#1e293b;border-radius:16px;border:1px solid #334155;color:#f8fafc;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);"><div style="font-size:32px;margin-bottom:12px;">⚠️</div><h2 style="font-size:16px;font-weight:700;margin-bottom:8px;">화면을 불러오는 중 오류가 발생했습니다</h2><p style="font-size:12px;color:#94a3b8;line-height:1.5;margin-bottom:16px;">브라우저 캐시 또는 환경 문제일 수 있습니다.<br><code style="font-size:11px;color:#f87171;word-break:break-all;">' + (e.message || '오류 코드 로딩 실패') + '</code></p><button onclick="window.location.reload(true)" style="background:#6366f1;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">페이지 새로고침</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
